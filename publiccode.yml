description:
  it-IT:
    shortDescription: Piattaforma tecnologica e applicativa di Intelligenza
      Artificiale per la PA.
    longDescription: >-
      AIxPA é una soluzione sviluppata nell'ambito del PNRR M1C1I1.4 (Progetto
      Bandiera PNC-A.1.3, CUP C49G22001020001) dalla Provincia Autonoma di
      Trento, in collaborazione con Fondazione Bruno Kessler (FBK) e Trentino
      Digitale.


      La piattaforma consente di valorizzare i dati disponibili presso la
      Pubblica Amministrazione, estrarre conoscenza a supporto dei processi
      decisionali, supportare analisi e simulazioni basate su gemelli digitali,
      migliorare l’efficienza dei servizi e ottimizzare i processi interni,
      accelerando la trasformazione digitale. Tutto avviene nel pieno rispetto
      dei valori etici e della normativa vigente, garantendo un uso responsabile
      dei dati e dei diritti dei cittadini.


      La piattaforma consente lo sviluppo e il riuso delle soluzioni di
      Intelligenza Artificiale attraverso la gestione di tutto il ciclo di vita
      MLOps, AIOps, e DataOps, in maniera trasparente, tracciabile, e portabile.


      La piattaforna fornisce inoltre funzionalitá generali di Intelligenza
      Artificiale per la Pubblica Amministrazione fra cui applicazioni di
      dialogo e LLM (RAG), tele-rilevamento (Remote Sensing) e riconoscimento
      vocale.
    documentation: https://github.com/ProvinciaAutonomaTrento/AIxPA
    features:
      - Gestione MLOps completa (modelli, dataset, pipeline, deployment)
      - Supporto LLM, RAG e chatbot per servizi pubblici
      - Piattaforma Decision Making e Gemello Digitale (Digital Twin)
      - Elaborazione dati di Telerilevamento (Remote Sensing)
      - Architettura Cloud-Native basata su Kubernetes e Helm
      - Multi-tenancy e sicurezza con OIDC e AAC
